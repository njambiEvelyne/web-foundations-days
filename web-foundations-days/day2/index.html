<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QuickNotes</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="header-inner">
        <h1>QuickNotes</h1>
        <p>Capture ideas before they disappear.</p>
        <nav class="main-nav" aria-label="Main navigation">
          <a href="index.html">Home</a>
          <a href="about.html">About</a>
        </nav>
      </div>
    </header>

    <main class="page-content">
      <section class="panel">
        <h2>Add a note</h2>
        <form id="note-form" class="note-form">
          <label for="note-input">New note</label>
          <input type="text" id="note-input" placeholder="Type a note..." />
          <button type="submit">Add Note</button>
        </form>
      </section>

      <section class="panel">
        <h2>Your notes</h2>
        <p id="note-count">You have 2 notes.</p>
        <ul id="notes-list">
          <li>Revise HTML forms</li>
          <li>Push my code to GitHub</li>
        </ul>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 QuickNotes. Built during Web Foundations.</p>
    </footer>
  </body>
</html>
